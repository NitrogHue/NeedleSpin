<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nickname Database</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --text: #f1f5f9;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }

        h1 {
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 0.5rem;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
            width: 100%;
            max-width: 800px;
            margin-top: 2rem;
        }

        .nick-card {
            background: var(--card);
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border-left: 4px solid var(--accent);
            transition: transform 0.2s;
        }

        .nick-card:hover {
            transform: translateY(-5px);
            background: #2d3748;
        }

        .status {
            font-size: 0.7rem;
            color: #10b981;
            text-transform: uppercase;
            margin-top: 0.5rem;
            display: block;
        }
    </style>
</head>
<body>

    <h1>Database: Nicknames</h1>
    
    <div class="container" id="nickname-list">
        </div>

    <script>
        // Data, která jsi původně vkládal do MongoDB
        const nicknames = [
            { name: "ShadowWolf" }, { name: "CyberFox" },
            { name: "DarkKnight" }, { name: "PixelNinja" },
            { name: "FireStorm" }, { name: "SilentHunter" },
            { name: "IceDragon" }, { name: "NightRider" },
            { name: "StormBreaker" }, { name: "GhostByte" }
        ];

        const listContainer = document.getElementById('nickname-list');

        // Funkce pro vykreslení karet
        nicknames.forEach(item => {
            const card = document.createElement('div');
            card.className = 'nick-card';
            card.innerHTML = `
                <strong>${item.name}</strong>
                <span class="status">● Online</span>
            `;
            listContainer.appendChild(card);
        });
    </script>
</body>
</html>
