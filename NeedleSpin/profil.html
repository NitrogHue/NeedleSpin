<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Můj profil - Hudební Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="profil.css">
    <style>
        .profile-cards-row {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
    </style>
</head>
<body>
    <div class="back-arrow" onclick="window.location.href='DomovniStranka.html'">
        ← Zpět
    </div>
    <div class="profile-container">
        <div class="profile-content">
            
            <div class="profile-header">
                <h1>Můj profil</h1>
            </div>

            <div class="profile-cards-row">
                <div class="profile-card">
                    <h3>Změnit uživatelské jméno</h3>
                    
                    <label>Nové uživatelské jméno</label>
                    <input type="text" id="new-username" placeholder="Zadej nové username">
                    
                    <label>Heslo (pro potvrzení)</label>
                    <input type="password" id="username-password" placeholder="Zadej své heslo">
                    
                    <button class="btn-save" onclick="zmenaJmena()">Změnit username</button>
                </div>
                <div class="profile-card">
                    <h3>Změnit heslo</h3>
                    
                    <label>Staré heslo</label>
                    <input type="password" id="old-password" placeholder="Zadej staré heslo">
                    
                    <label>Nové heslo</label>
                    <input type="password" id="new-password" placeholder="Zadej nové heslo">
                    
                    <label>Potvrzení nového hesla</label>
                    <input type="password" id="new-password2" placeholder="Potvrď nové heslo">
                    
                    <button class="btn-save" onclick="zmenaHesla()">Změnit heslo</button>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
