<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeedleSpin - Kasino Lobby</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #1a1a2e;
            --bg-sidebar: #ff6b35; 
            --bg-card: #2d2d44;
            --text-main: #ffffff;
            --text-muted: #aaa;
            --border-color: #5a5a7a;
            --accent: #e55a2b;
            --table-border: #3d3d54;
        }

        body.light-mode {
            --bg-main: #f0f2f5;
            --bg-sidebar: #ffffff; 
            --bg-card: #ffffff;
            --text-main: #1a1a2e;
            --text-muted: #555;
            --border-color: #cccccc;
            --accent: #ff6b35;
            --table-border: #eeeeee;
        }
        body.dark-mode {
            --bg-main: #0a0a0a;
            --bg-sidebar: #111111;
            --bg-card: #161616;
            --bg-item: #0a0a0a;
            --text-main: #e0e0e0;
            --text-muted: #777;
            --border-color: #333;
            --item-border: #333;
            --accent: #ff4500;
            --progress-bg: #1a1a1a;
        }

        body { 
            background-color: var(--bg-main) !important; 
            color: var(--text-main) !important; 
            transition: 0.3s;
            margin: 0;
            font-family: sans-serif;
        }
        .sidebar {
            background-color: var(--bg-sidebar) !important;
            height: 100vh; position: fixed; width: 250px; padding: 20px; z-index: 1000;
            border-right: 1px solid var(--border-color);
            transition: background-color 0.3s;
            display: flex; flex-direction: column;
        }
        .sidebar .profile { text-align: center; margin-bottom: 30px; width: 100%; }
        .sidebar .profile img { width: 80px; height: 80px; border-radius: 50%; background-color: white; padding: 5px; object-fit: cover; border: 3px solid var(--accent); display: block; margin: 0 auto; }
        
        .sidebar .nav-link { 
            color: var(--text-main) !important; 
            padding: 12px; text-decoration: none; display: block; border-radius: 8px;
        }
        .sidebar .nav-link:hover { background-color: var(--accent); color: white !important; }

        .main-content { margin-left: 250px; padding: 30px; }
        .game-card {
            background-color: var(--bg-card); 
            border-radius: 12px; padding: 30px; 
            text-align: center; cursor: pointer; transition: 0.3s;
            border: 2px solid var(--border-color); 
            text-decoration: none; display: block; 
            color: var(--text-main) !important;
        }
        .game-card:hover { transform: translateY(-10px); border-color: var(--accent); }
        .game-icon { font-size: 60px; margin-bottom: 15px; }
        .leaderboard-panel { 
            background: var(--bg-card); 
            border-radius: 12px; padding: 25px; 
            border: 1px solid var(--border-color); 
            transition: 0.3s;
        }
        .leaderboard-table { width: 100%; color: var(--text-main); }
        .leaderboard-table th { color: #ff6b35; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); }
        .leaderboard-table td { padding: 12px 0; border-bottom: 1px solid var(--table-border); }
        
        .rank-1 { color: gold !important; font-weight: bold; font-size: 1.2rem; }
        .rank-2 { color: silver !important; font-weight: bold; font-size: 1.1rem; }
        .rank-3 { color: #cd7f32 !important; font-weight: bold; font-size: 1.1rem; }
        
        h1, h3 { color: var(--text-main) !important; }
        .text-muted { color: var(--text-muted) !important; }

        @media (max-width: 768px) {
            .sidebar { width: 100%; height: auto; position: fixed; top: auto; bottom: 0; left: 0; display: flex; flex-direction: row; justify-content: space-around; border-top: 1px solid var(--border-color); border-right: none; }
            .sidebar .profile { display: none; }
            .sidebar .nav-link { padding: 8px; font-size: 14px; }
            .main-content { margin-left: 0; padding-bottom: 80px; }
        }
    </style>
</head>
<body>
    <script>
         (function() {
        const theme = localStorage.getItem('theme');
        if (theme === 'light') document.body.classList.add('light-mode');
        else if (theme === 'dark') document.body.classList.add('dark-mode');
    })();
    </script>

    <div class="sidebar">
        <div class="profile" style="cursor: pointer;" onclick="window.location.href='profil.html'">
            <img src="https://placehold.co/80" alt="Avatar">
        </div>

        <nav style="width: 100%;">
            <a href="DomovniStranka.html" class="nav-link">🏠 Domovská stránka</a>
            <a href="obchod.html" class="nav-link">🛒 Obchod</a>
            <a href="inventory.html" class="nav-link">📦 Inventář</a>
            <a href="trziste.html" class="nav-link">📈 Tržiště</a>
            <a href="minihry.html" class="nav-link" style="font-weight: bold; color: #c44111 !important;">🎮 Minihry</a>
            <a href="questy.html" class="nav-link">🎯 Questy</a>
            <a href="login.html" class="nav-link">🔐 Přihlášení</a>
        </nav>

        <div style="margin-top:auto; display:flex; justify-content:center; border-top: 1px solid var(--border-color); padding-top: 10px; width: 100%;">
            <a href="#" class="nav-link" onclick="logout()" style="width: 100%; text-align: center;">📤 Odhlásit se</a>
        </div>
    </div>
    
    <div class="main-content">
        <h1 class="mb-5"><i class="fas fa-dice"></i> Minihry</h1>

        <div class="row mb-5">
            <div class="col-md-6 mb-3">
                <a href="miny.html" class="game-card">
                    <div class="game-icon text-warning"><i class="fas fa-bomb"></i></div>
                    <h3>Miny</h3>
                </a>
            </div>
            <div class="col-md-6 mb-3">
                <a href="skorapky.html" class="game-card">
                    <div class="game-icon text-info"><i class="fas fa-boxes"></i></div>
                    <h3>Skořápky</h3>
                </a>
            </div>
        </div>

        <div class="leaderboard-panel">
            <h3 class="mb-4"><i class="fas fa-trophy text-warning"></i> Síň slávy - Top 50 Hráčů</h3>
            <table class="leaderboard-table">
                <thead>
                    <tr>
                        <th># Rank</th>
                        <th>Hráč</th>
                        <th class="text-end">Body</th>
                    </tr>
                </thead>
                <tbody id="lb-body">
                    <tr><td colspan="3" class="text-center text-muted">Načítám žebříček...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        async function loadLB() {
            const tbody = document.getElementById('lb-body');
            try {
                const res = await fetch('leaderboard.php');
                const data = await res.json();
                
                if (!data.success) {
                    tbody.innerHTML = `<tr><td colspan="3" class="text-center text-danger">${data.message}</td></tr>`;
                    return;
                }

                tbody.innerHTML = '';
                data.leaderboard.forEach((user, index) => {
                    const rank = index + 1;
                    let rankClass = ''; let icon = '';
                    if(rank === 1) { rankClass = 'rank-1'; icon = '<i class="fas fa-crown"></i> '; }
                    else if (rank === 2) { rankClass = 'rank-2'; icon = '<i class="fas fa-medal"></i> '; }
                    else if (rank === 3) { rankClass = 'rank-3'; icon = '<i class="fas fa-award"></i> '; }

                    tbody.innerHTML += `
                        <tr>
                            <td class="${rankClass}">${icon}${rank}.</td>
                            <td class="fw-bold">${user.username}</td>
                            <td class="fw-bold text-end" style="color: #00d26a;">${user.body} B</td>
                        </tr>
                    `;
                });
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="3" class="text-center text-danger">Chyba načítání</td></tr>';
            }
        }
        loadLB();
    </script>
</body>

</html>
