<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeedleSpin - Obchod</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #1a1a2e;
            --bg-sidebar: #ff6b35; 
            --bg-card: #2d2d44;
            --text-main: #ffffff;
            --text-muted: #bbb;
            --border-color: #3d3d54;
            --accent: #e55a2b;
            --reel-bg: #000000;
        }

        body.light-mode {
            --bg-main: #f0f2f5;
            --bg-sidebar: #ffffff;   
            --bg-card: #ffffff;
            --text-main: #1a1a2e;
            --text-muted: #555;
            --border-color: #cccccc;
            --accent: #ff6b35;
            --reel-bg: #1a1a1a;
        }
        body.dark-mode {
            --bg-main: #0a0a0a;
            --bg-sidebar: #111111;
            --bg-card: #161616;
            --bg-item: #0a0a0a;
            --text-main: #e0e0e0;
            --text-muted: #777;
            --border-color: #333;
            --item-border: #333;
            --accent: #ff4500;
            --progress-bg: #1a1a1a;
        }

        body {
            background-color: var(--bg-main) !important; 
            color: var(--text-main) !important;
            transition: 0.3s;
            margin: 0;
            font-family: sans-serif;
        }

        .sidebar {
            background-color: var(--bg-sidebar) !important;
            height: 100vh; position: fixed; width: 250px; padding: 20px; z-index: 1000;
            border-right: 1px solid var(--border-color);
            transition: 0.3s;
            display: flex; flex-direction: column;
        }

        .sidebar .profile { margin-bottom: 30px; display: flex; justify-content: center; }
        .sidebar .profile img { width: 80px; height: 80px; border-radius: 50%; background-color: white; padding: 5px; object-fit: cover; border: 3px solid var(--accent); display: block; margin: 0 auto; }
        
        .sidebar .nav-link { 
            color: var(--text-main) !important; 
            padding: 12px; text-decoration: none; display: block; border-radius: 8px;
        }
        .sidebar .nav-link:hover { background-color: var(--accent); color: white !important; }
        .sidebar .nav-link.active { font-weight: bold; color: #c44111 !important; }

        .main-content { margin-left: 250px; padding: 30px; transition: 0.3s; }

        .pack-card {
            background-color: var(--bg-card);
            border-radius: 10px; padding: 20px; text-align: center;
            cursor: pointer; transition: transform 0.2s, background-color 0.2s;
            border: 2px solid var(--border-color);
            color: var(--text-main);
        }
        .pack-card:hover {
            transform: translateY(-5px);
            background-color: var(--bg-card);
            border-color: #ff6b35;
        }
        .pack-icon { font-size: 50px; color: #ff6b35; margin-bottom: 15px; }

        .spinner-wrapper {
            background-color: var(--bg-card);
            border-radius: 10px; padding: 20px; margin-bottom: 30px;
            text-align: center; border: 1px solid var(--border-color);
            overflow: hidden; position: relative; display: block;
            transition: 0.3s;
        }
        .spinner-window {
            width: 100%; height: 180px; position: relative; overflow: hidden;
            background: var(--reel-bg); border-radius: 8px; margin-top: 10px;
            box-shadow: inset 0 0 20px #000;
        }
        .spinner-marker {
            position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; 
            background: #ff6b35; z-index: 10; box-shadow: 0 0 10px #ff6b35;
        }
        .reel {
            display: flex; height: 100%; align-items: center; 
            position: absolute; left: 0; will-change: transform;
        }
        .spin-item {
            width: 150px; height: 150px; margin: 0 5px; 
            background: var(--bg-card); border: 1px solid var(--border-color);
            display: flex; flex-direction: column; 
            align-items: center; justify-content: center; border-radius: 6px;
        }
        .spin-item img { width: 100px; height: 100px; object-fit: cover; border-radius: 4px; margin-bottom: 5px; }
        .spin-item p { 
            font-size: 11px; margin: 0; color: var(--text-main);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 130px; 
        }

        .btn-inv-header {
            background-color: #ff6b35; color: white; text-decoration: none;
            padding: 8px 20px; border-radius: 30px; font-weight: bold;
            transition: background 0.3s; display: flex; align-items: center; border: none;
        }
        .btn-inv-header:hover { background-color: #e55a2b; color: white; }

        h1, h3 { color: var(--text-main) !important; }
        .text-muted { color: var(--text-muted) !important; }

        /* MOBILNÍ LAYOUT */
        @media (max-width: 768px) {
            .sidebar {
                width: 100% !important; height: auto !important; position: fixed !important; bottom: 0 !important; top: auto !important; left: 0 !important;
                padding: 10px 5px !important; flex-direction: column !important; border-radius: 20px 20px 0 0; z-index: 9999 !important;
                background-color: #ff6b35 !important; border-right: none;
            }
            .sidebar .profile { display: none; }
            .sidebar nav { display: flex !important; flex-wrap: wrap !important; justify-content: center !important; }
            .sidebar .nav-link { flex: 1 1 24% !important; font-size: 11px !important; text-align: center; margin-bottom: 0; padding: 8px 2px !important; }
            .sidebar div[style*="margin-top:auto"] { position: static !important; width: 100% !important; margin-top: 5px !important; padding-top: 5px !important; border-top: 1px solid rgba(255,255,255,0.2) !important; display: flex !important; justify-content: center !important; gap: 20px !important; }
            .main-content { margin-left: 0 !important; padding: 15px; padding-bottom: 150px !important; }
        }
    </style>
</head>
<body>
    <script>
       (function() {
        const theme = localStorage.getItem('theme');
        if (theme === 'light') document.body.classList.add('light-mode');
        else if (theme === 'dark') document.body.classList.add('dark-mode');
    })();
    </script>

     <div class="sidebar">
        <div class="profile" style="cursor: pointer;" onclick="window.location.href='profil.html'">
            <img src="https://placehold.co/80" alt="Avatar">
        </div>

        <nav>
            <a href="index.html" class="nav-link">🏠 Domů</a>
            <a href="obchod.html" class="nav-link active">🛒 Obchod</a>
            <a href="inventory.html" class="nav-link">📦 Inventář</a>
            <a href="trziste.html" class="nav-link">📈 Tržiště</a>
            <a href="minihry.html" class="nav-link">🎮 Minihry</a>
            <a href="questy.html" class="nav-link">🎯 Questy</a>
            <a href="profil.html" class="nav-link">👤 Profil</a>
            <a href="login.html" class="nav-link">🔐 Login</a>
        </nav>

        <div style="margin-top:auto; display:flex; justify-content:center; border-top: 1px solid var(--border-color); padding-top: 10px; width: 100%;">
            <a href="#" class="nav-link" onclick="logout()" style="width: 100%; text-align: center;">📤 Odhlásit se</a>
        </div>
    </div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="m-0">Obchod</h1>
            <div class="d-flex align-items-center gap-3">
                <div style="background: var(--bg-card); padding: 10px 20px; border-radius: 30px; border: 1px solid var(--border-color); white-space: nowrap;">
                    Vaše body: <span id="points-display" style="color: #ff6b35; font-weight: bold;"></span>
                </div>
                <a href="inventory.html" class="btn-inv-header">
                    <i class="fas fa-box me-2"></i> Můj Inventář
                </a>
            </div>
        </div>

        <div class="spinner-wrapper" id="spinner-area">
            <h3 id="spin-status" style="margin: 0;"></h3>
            <div class="spinner-window">
                <div class="spinner-marker"></div>
                <div class="reel" id="reel">
                    <div style="width: 100%; text-align: center; color: #777; padding-top: 70px; font-size: 1.2rem;">
                        <i class="fas fa-arrow-down"></i> ZVOL SI ŽÁNR <i class="fas fa-arrow-down"></i>
                    </div>
                </div>
            </div>
        </div>

        <div class="row row-cols-1 row-cols-md-3 row-cols-lg-5 g-4"> 
            <div class="col">
                <div class="pack-card" onclick="spinBox('Rap')">
                    <div class="pack-icon"><i class="fas fa-microphone"></i></div>
                    <h3>Rap Pack</h3>
                    <p class="text-muted">Cena: <span style="color: #ff6b35;">100 B</span></p>
                </div>
            </div>
            <div class="col">
                <div class="pack-card" onclick="spinBox('Pop')">
                    <div class="pack-icon"><i class="fas fa-star"></i></div>
                    <h3>Pop Pack</h3>
                    <p class="text-muted">Cena: <span style="color: #ff6b35;">100 B</span></p>
                </div>
            </div>
            <div class="col">
                <div class="pack-card" onclick="spinBox('Rock')">
                    <div class="pack-icon"><i class="fas fa-guitar"></i></div>
                    <h3>Rock Pack</h3>
                    <p class="text-muted">Cena: <span style="color: #ff6b35;">100 B</span></p>
                </div>
            </div>
            <div class="col">
                <div class="pack-card" onclick="spinBox('Metal')">
                    <div class="pack-icon"><i class="fas fa-skull"></i></div>
                    <h3>Metal Pack</h3>
                    <p class="text-muted">Cena: <span style="color: #ff6b35;">100 B</span></p>
                </div>
            </div>
            <div class="col">
                <div class="pack-card" onclick="spinBox('Jazz')">
                    <div class="pack-icon"><i class="fas fa-record-vinyl"></i></div>
                    <h3>Jazz Pack</h3>
                    <p class="text-muted">Cena: <span style="color: #ff6b35;">100 B</span></p>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        fetch('obchod.php?action=check').then(r=>r.json()).then(d => {
            if(d.new_balance !== undefined) {
                document.getElementById('points-display').innerText = d.new_balance;
            }
        }).catch(e=>{});

        let isSpinning = false;
        const CARD_WIDTH = 160;

        async function spinBox(genre) {
            if (isSpinning) return;
            const reel = document.getElementById('reel');
            const status = document.getElementById('spin-status');
            const pointsDisplay = document.getElementById('points-display');
            isSpinning = true;
            status.innerText = "";
            reel.style.transition = 'none';
            reel.style.transform = 'translateX(0px)';
            reel.innerHTML = '<div style="color:white; width:100%; text-align:center; padding-top:70px;"><i class="fas fa-circle-notch fa-spin"></i> Načítám...</div>';

            const formData = new FormData();
            formData.append('genre', genre);

            try {
                const response = await fetch('obchod.php', { method: 'POST', body: formData });
                const data = await response.json();

                if (!data.success) {
                    alert(data.message);
                    isSpinning = false;
                    status.innerText = "Chyba";
                    reel.innerHTML = '<div style="width: 100%; text-align: center; color: #777; padding-top: 70px;">Zkuste to znovu</div>';
                    return;
                }

                pointsDisplay.innerText = data.new_balance;
                let reelHtml = '';
                const itemsPool = data.items;
                const winnerItem = itemsPool[data.winner_index];
                const SPINS_BEFORE_WIN = 80; 
                
                for (let i = 0; i < SPINS_BEFORE_WIN; i++) {
                    const randomIdx = Math.floor(Math.random() * itemsPool.length);
                    reelHtml += createCardHtml(itemsPool[randomIdx]);
                }
                reelHtml += createCardHtml(winnerItem);
                for (let i = 0; i < 10; i++) {
                    const randomIdx = Math.floor(Math.random() * itemsPool.length);
                    reelHtml += createCardHtml(itemsPool[randomIdx]);
                }
                reel.innerHTML = reelHtml;

                const containerWidth = document.querySelector('.spinner-window').offsetWidth;
                const targetPos = -((SPINS_BEFORE_WIN * CARD_WIDTH) - (containerWidth / 2) + (CARD_WIDTH / 2));
                const randomOffset = Math.floor(Math.random() * 40) - 20;
                const finalPos = targetPos + randomOffset;

                setTimeout(() => {
                    reel.style.transition = 'transform 8s cubic-bezier(0.15, 0, 0.15, 1)'; 
                    reel.style.transform = `translateX(${finalPos}px)`;
                }, 50);

                setTimeout(() => {
                    isSpinning = false;
                    status.innerHTML = `Vyhrál jsi: <span style="color:#ff6b35; font-size:1.2em;">${winnerItem.title}</span>!`;
                    const wrapper = document.querySelector('.spinner-wrapper');
                    wrapper.style.borderColor = "#00ff00";
                    wrapper.style.boxShadow = "0 0 30px rgba(0, 255, 0, 0.3)";
                    setTimeout(() => {
                        wrapper.style.borderColor = "var(--border-color)";
                        wrapper.style.boxShadow = "none";
                    }, 1500);
                }, 8100);

            } catch (e) {
                alert("Chyba spojení.");
                isSpinning = false;
            }
        }

        function createCardHtml(item) {
            const img = item.thumb || item.cover_image || 'https://placehold.co/150';
            const title = item.title.length > 20 ? item.title.substring(0, 18) + '...' : item.title;
            return `
                <div class="spin-item">
                    <img src="${img}">
                    <p>${title}</p>
                </div>
            `;
        }
    </script>
</body>
</html>
