<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeedleSpin - Questy</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #1a1a2e;
            --bg-sidebar: #ff6b35; 
            --bg-card: #2d2d44;
            --bg-item: #1a1a2e;
            --text-main: #ffffff;
            --text-muted: #aaa;
            --border-color: #5a5a7a;
            --item-border: #3d3d54;
            --accent: #ff6b35;
            --progress-bg: #0f0f1a;
        }

        body.light-mode {
            --bg-main: #f0f2f5;
            --bg-sidebar: #ffffff;   
            --bg-card: #ffffff;
            --bg-item: #f9f9f9;
            --text-main: #1a1a2e;
            --text-muted: #555;
            --border-color: #cccccc;
            --item-border: #eeeeee;
            --accent: #ff6b35;
            --progress-bg: #e0e0e0;
        }

        body.dark-mode {
            --bg-main: #0a0a0a;
            --bg-sidebar: #111111;
            --bg-card: #161616;
            --bg-item: #0a0a0a;
            --text-main: #e0e0e0;
            --text-muted: #777;
            --border-color: #333;
            --item-border: #333;
            --accent: #ff4500;
            --progress-bg: #1a1a1a;
        }

        body { 
            background-color: var(--bg-main) !important; 
            color: var(--text-main) !important; 
            transition: 0.3s;
            margin: 0;
            font-family: sans-serif;
            min-height: 100vh;
        }

        .sidebar {
            background-color: var(--bg-sidebar) !important;
            height: 100vh; position: fixed; width: 250px; padding: 20px; z-index: 1000;
            border-right: 1px solid var(--border-color);
            transition: 0.3s;
            display: flex; flex-direction: column;
        }
        
        .sidebar .profile { margin-bottom: 30px; display: flex; justify-content: center; }
        .sidebar .profile img { width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--accent); background-color: white; object-fit: cover; }
        
        .sidebar .nav-link { 
            color: var(--text-main) !important; 
            padding: 12px; text-decoration: none; display: block; border-radius: 8px; margin-bottom: 5px;
        }
        .sidebar .nav-link:hover { background-color: var(--accent); color: white !important; }
        .sidebar .nav-link.active { font-weight: bold; color: #c44111 !important; }

        .main-content { margin-left: 250px; padding: 30px; transition: 0.3s; }

        .quest-card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .section-title {
            color: var(--accent);
            margin-bottom: 20px;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        .quest-item {
            background: var(--bg-item);
            border: 1px solid var(--item-border);
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: 0.2s;
        }
        .quest-item:hover { border-color: var(--accent); }

        .quest-info h5 { margin: 0 0 5px 0; font-size: 16px; color: var(--text-main); }
        .quest-reward { color: #00d26a; font-weight: bold; font-size: 14px; }

        .progress-wrapper { width: 150px; text-align: right; }
        .progress-bar-bg {
            background: var(--progress-bg);
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 5px;
            border: 1px solid var(--item-border);
        }
        .progress-fill {
            background: var(--accent);
            height: 100%;
            transition: width 0.4s ease;
        }
        .progress-text { font-size: 12px; color: var(--text-muted); font-weight: bold; }

        .quest-completed { opacity: 0.6; pointer-events: none; border-color: #00d26a !important; }
        .quest-completed .progress-fill { background: #00d26a; }

        @media (max-width: 768px) {
            .sidebar {
                width: 100% !important; height: auto !important; position: fixed !important; bottom: 0 !important; top: auto !important; left: 0 !important;
                padding: 10px 5px !important; flex-direction: column !important; border-radius: 20px 20px 0 0; z-index: 9999 !important;
                background-color: #ff6b35 !important;
            }
            .sidebar .profile { display: none; }
            .sidebar nav { display: flex !important; flex-wrap: wrap !important; justify-content: center !important; }
            .sidebar .nav-link { flex: 1 1 24% !important; font-size: 11px !important; text-align: center; margin-bottom: 0; padding: 8px 2px !important; }
            .sidebar div[style*="margin-top:auto"] { position: static !important; width: 100% !important; margin-top: 5px !important; padding-top: 5px !important; border-top: 1px solid rgba(255,255,255,0.2) !important; display: flex !important; justify-content: center !important; gap: 20px !important; }
            .main-content { margin-left: 0 !important; padding: 15px; padding-bottom: 150px !important; }
            
            .quest-item { flex-direction: column; align-items: flex-start; gap: 15px; }
            .progress-wrapper { width: 100%; text-align: left; }
        }
    </style>
</head>
<body>
    <script>
        (function() {
            const theme = localStorage.getItem('theme');
            if (theme === 'light') document.body.classList.add('light-mode');
            else if (theme === 'dark') document.body.classList.add('dark-mode');
        })();
    </script>

    <div class="sidebar">
        <div class="profile" style="cursor: pointer;" onclick="window.location.href='profil.html'">
            <img src="https://placehold.co/80" alt="Avatar">
        </div>
        <nav>
            <a href="index.html" class="nav-link">🏠 Domů</a>
            <a href="obchod.html" class="nav-link">🛒 Obchod</a>
            <a href="inventory.html" class="nav-link">📦 Inventář</a>
            <a href="trziste.html" class="nav-link">📈 Tržiště</a>
            <a href="minihry.html" class="nav-link">🎮 Minihry</a>
            <a href="questy.html" class="nav-link active">🎯 Questy</a>
            <a href="profil.html" class="nav-link">👤 Profil</a>
            <a href="login.html" class="nav-link">🔐 Login</a>
        </nav>
        <div style="margin-top:auto; display:flex; justify-content:center; border-top: 1px solid var(--border-color); padding-top: 10px; width: 100%;">
            <a href="#" class="nav-link" onclick="odhlasit()" style="width: 100%; text-align: center;">📤 Odhlásit se</a>
        </div>
    </div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="m-0"><i class="fas fa-bullseye text-warning"></i> Aktivní Questy</h1>
        </div>

        <div class="quest-card" id="quests-container">
            <div class="text-center py-5 text-muted">
                <i class="fas fa-spinner fa-spin fa-2x mb-3"></i><br>Načítám tvé úkoly...
            </div>
        </div>
    </div>

    <script>
        async function loadQuests() {
            try {
                const res = await fetch('quests.php');
                const data = await res.json();
                const container = document.getElementById('quests-container');

                if (!data.success) {
                    container.innerHTML = `<p class="text-danger text-center py-4">${data.message}</p>`;
                    return;
                }

                if (!data.quests || data.quests.length === 0) {
                    container.innerHTML = `<p class="text-muted text-center py-4">Nemáš žádné aktivní úkoly.</p>`;
                    return;
                }

                const daily = data.quests.filter(q => q.typ_trvani === 'denni');
                const weekly = data.quests.filter(q => q.typ_trvani === 'tydenni');
                const monthly = data.quests.filter(q => q.typ_trvani === 'mesicni');

                let html = '';

                if(daily.length > 0) {
                    html += `<h3 class="section-title"><i class="fas fa-sun"></i> Denní úkoly</h3>`;
                    daily.forEach(q => html += buildQuestHTML(q));
                }
                if(weekly.length > 0) {
                    html += `<h3 class="section-title"><i class="fas fa-calendar-week"></i> Týdenní úkoly</h3>`;
                    weekly.forEach(q => html += buildQuestHTML(q));
                }
                if(monthly.length > 0) {
                    html += `<h3 class="section-title"><i class="fas fa-moon"></i> Měsíční úkoly</h3>`;
                    monthly.forEach(q => html += buildQuestHTML(q));
                }

                container.innerHTML = html;

            } catch (e) {
                document.getElementById('quests-container').innerHTML = '<p class="text-danger text-center">Chyba připojení.</p>';
            }
        }

        function buildQuestHTML(q) {
            const isCompleted = parseInt(q.dokonceno) === 1;
            const progress = Math.min(q.progres, q.cil_pocet);
            const pct = (progress / q.cil_pocet) * 100;
            const compClass = isCompleted ? 'quest-completed' : '';
            const statusText = isCompleted ? '<i class="fas fa-check text-success"></i> Hotovo' : `${progress} / ${q.cil_pocet}`;

            return `
                <div class="quest-item ${compClass}">
                    <div class="quest-info">
                        <h5>${q.nazev}</h5>
                        <div class="quest-reward"><i class="fas fa-coins text-warning"></i> +${q.odmena} Bodů</div>
                    </div>
                    <div class="progress-wrapper">
                        <div class="progress-bar-bg">
                            <div class="progress-fill" style="width: ${pct}%;"></div>
                        </div>
                        <div class="progress-text">${statusText}</div>
                    </div>
                </div>
            `;
        }

        loadQuests();
    </script>
</body>
</html>
