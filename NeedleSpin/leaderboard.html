<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeedleSpin - Žebříček</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #1a1a2e !important; color: white !important; }
        .leaderboard-table { width: 100%; max-width: 800px; margin: 0 auto; background: #2d2d44; border-radius: 12px; overflow: hidden; }
        .leaderboard-table th { background: #3d3d54; padding: 15px; color: #ff6b35; text-align: left; }
        .leaderboard-table td { padding: 15px; border-bottom: 1px solid #3d3d54; }
        .leaderboard-table tr:hover { background: #3d3d54; }
        .rank-1 { color: gold; font-weight: bold; font-size: 1.2rem; }
        .rank-2 { color: silver; font-weight: bold; font-size: 1.1rem; }
        .rank-3 { color: #cd7f32; font-weight: bold; font-size: 1.1rem; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="profile"><img src="https://placehold.co/60" alt="Profil"></div>
        <nav>
            <a href="index.html" class="nav-link">🏠 Domovská stránka</a>
            <a href="obchod.html" class="nav-link">🛒 Obchod</a>
            <a href="inventory.html" class="nav-link">📦 Inventář</a>
            <a href="trziste.html" class="nav-link">📈 Tržiště</a>
            <a href="minihry.html" class="nav-link">🎮 Minihry</a>
            <a href="questy.html" class="nav-link">🎯 Questy</a>
            <a href="leaderboard.html" class="nav-link" style="background-color: #e55a2b;">🏆 Žebříček</a>
        </nav>
    </div>

    <div class="main-content">
        <h1 class="text-center mb-5 text-white"><i class="fas fa-trophy text-warning"></i> Síň slávy</h1>
        
        <table class="leaderboard-table">
            <thead>
                <tr>
                    <th># Rank</th>
                    <th>Hráč</th>
                    <th>Body</th>
                </tr>
            </thead>
            <tbody id="lb-body">
                <tr><td colspan="3" class="text-center">Načítám žebříček...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        async function loadLB() {
            const res = await fetch('leaderboard.php');
            const data = await res.json();
            const tbody = document.getElementById('lb-body');
            tbody.innerHTML = '';
            
            data.leaderboard.forEach((user, index) => {
                const rank = index + 1;
                let rankClass = '';
                let icon = '';
                
                if(rank === 1) { rankClass = 'rank-1'; icon = '<i class="fas fa-crown"></i> '; }
                else if (rank === 2) { rankClass = 'rank-2'; icon = '<i class="fas fa-medal"></i> '; }
                else if (rank === 3) { rankClass = 'rank-3'; icon = '<i class="fas fa-award"></i> '; }

                tbody.innerHTML += `
                    <tr>
                        <td class="${rankClass}">${icon}#${rank}</td>
                        <td class="fw-bold">${user.username}</td>
                        <td class="text-success fw-bold">${user.body} B</td>
                    </tr>
                `;
            });
        }
        loadLB();
    </script>
</body>

</html>
